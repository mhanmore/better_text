name: Feature
description: Propose an implementation unit with testable reader or author value.
title: ""
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What becomes possible or more dependable for an author or reader?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable statements.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: Fixtures and compatibility risks
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and follow-ups

